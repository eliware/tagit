version: "13.0"
description: Specification for TagIt release commands and repository checks.
directives:
  - id: E-1100.0
    dos:
      - Check release readiness, owner handoff, and post-release results for Eliware repositories.
      - Allow documented test output during validation.
      - Let release add an empty commit, then push main and its release tag.
      - >-
        Require CI results for the exact commit and classify runner platforms from configured
        labels.
    donts:
      - Do not stage files, edit tracked content, deploy, publish, or make release decisions.
      - Do not infer a job operating system from its name.
    children:
      - id: E-1100.0.0
        dos:
          - Accept v13 ci.yaml and npm.yaml workflows and check gates by publication profile.
          - Check npm.yaml only when npm-published applies.
          - Require package.json in every target repository.
          - >-
            Require @eliware/test as a dev dependency and eliware-test as scripts.test in target
            repositories.
          - In @eliware/test, require scripts.test to equal node bin/eliware-test.mjs.
          - >-
            For ghcr-published, require a numeric tag trigger, ghcr-publish environment, and image
            push.
          - >-
            Require release to add an empty versioned commit after preflight and push main with its
            tag.
          - Require release to report workflow links after applicable workflows start.
          - >-
            Require release-wait to check tagged commit CI and applicable npm.yaml or ghcr.yaml
            publication.
          - Require each npm visibility check to report one concise status line.
          - >-
            Require environment example files only when a repository declares runtime environment
            settings.
        donts:
          - Do not require .env.example in every target repository.
          - Do not classify GitHub jobs by job name when runner labels exist.
